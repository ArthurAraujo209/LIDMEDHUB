<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F4C5C">
  <meta name="robots" content="noindex">
  <title>Meu Histórico — LIDMED HUB</title>

  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="/js/ui/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/pages/profile.css">
  <script type="module" src="/js/ui/site-nav.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/dashboard.html" class="brand">
        <span class="brand-mark">L</span>
        <span>LIDMED HUB</span>
      </a>
      <div class="row">
        <a href="/meu-perfil.html" class="btn btn-ghost btn-sm">Meu Perfil</a>
        <button id="logout-btn" class="btn btn-secondary btn-sm">Sair</button>
      </div>
    </div>
  </header>

  <main class="profile-shell">
    <div class="profile-container">
      <h1 style="margin-bottom: var(--space-5);">Meu Histórico</h1>

      <div id="loading-state" style="text-align: center; padding: var(--space-6);">
        <p class="text-muted">Carregando histórico...</p>
      </div>

      <div id="history-content" style="display: none;">
        <div id="attempts-list"></div>

        <div id="empty-state" class="empty-state" style="display: none;">
          <div class="empty-state-icon">📋</div>
          <p>Você ainda não resolveu nenhum caso</p>
          <a href="/casoteca.html" class="btn btn-primary" style="margin-top: var(--space-4);">
            Explorar Casoteca
          </a>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { requireApproved } from "/js/guards.js";
    import { logout } from "/js/auth.js";
    import { getUserAttempts } from "/js/attempts.js";
    import { getCase, getCaseVersion } from "/js/cases.js";
    import { getUserRating } from "/js/ratings.js";
    import { getScoreColor } from "/js/scoring.js";

    let currentUser = null;

    (async () => {
      const ctx = await requireApproved();
      if (!ctx) return;
      currentUser = ctx.user;

      const loadingState = document.getElementById("loading-state");
      const historyContent = document.getElementById("history-content");
      const attemptsList = document.getElementById("attempts-list");
      const emptyState = document.getElementById("empty-state");

      try {
        const attempts = await getUserAttempts(currentUser.uid);
        const solvedAttempts = attempts.filter(attempt => attempt.status === "solved");

        loadingState.style.display = "none";
        historyContent.style.display = "block";

        if (solvedAttempts.length === 0) {
          emptyState.style.display = "block";
          return;
        }

        for (const attempt of solvedAttempts) {
          const caseData = await getCase(attempt.caseId);
          const caseVersion = caseData
            ? await getCaseVersion(attempt.caseId, attempt.caseVersion || caseData.currentVersion)
            : null;

          const completedAt = attempt.completedAt?.toDate?.() ||
            (attempt.completedAt ? new Date(attempt.completedAt) : null);
          const dateStr = !completedAt || Number.isNaN(completedAt.getTime())
            ? "Data não disponível"
            : completedAt.toLocaleString("pt-BR", {
              day: "2-digit",
              month: "2-digit",
              year: "numeric",
              hour: "2-digit",
              minute: "2-digit"
            });
          const scoreColor = getScoreColor(Number(attempt.score) || 0);
          const latestHypothesis = [...(attempt.hypotheses || [])].reverse()
            .find(hypothesis => hypothesis.text && hypothesis.text.trim());

          const card = document.createElement("div");
          card.className = "form-section";
          card.style.marginBottom = "var(--space-4)";
          const heading = document.createElement("div");
          heading.style.display = "flex";
          heading.style.flexWrap = "wrap";
          heading.style.justifyContent = "space-between";
          heading.style.alignItems = "start";
          heading.style.gap = "var(--space-4)";
          const caseInfo = document.createElement("div");
          caseInfo.style.flex = "1";
          const title = document.createElement("h4");
          title.style.marginBottom = "var(--space-2)";
          const metadata = document.createElement("div");
          metadata.style.display = "flex";
          metadata.style.flexWrap = "wrap";
          metadata.style.gap = "var(--space-2)";
          metadata.style.marginBottom = "var(--space-2)";
          const specialty = document.createElement("span");
          specialty.className = "badge";
          const scoreBadge = document.createElement("span");
          scoreBadge.className = `badge badge-${scoreColor}`;
          scoreBadge.textContent = `${attempt.score ?? "—"} pontos`;
          const hints = document.createElement("span");
          hints.className = "text-xs text-subtle";
          hints.textContent = `${attempt.hintsCount || 0} dica${(attempt.hintsCount || 0) !== 1 ? "s" : ""}`;
          const duration = document.createElement("span");
          duration.className = "text-xs text-subtle";
          duration.textContent = `${Math.floor((attempt.durationSeconds || 0) / 60)} min`;
          const date = document.createElement("p");
          date.className = "text-xs text-subtle";
          date.textContent = dateStr;
          metadata.append(specialty, scoreBadge, hints, duration);
          caseInfo.append(title, metadata, date);
          heading.appendChild(caseInfo);

          if (caseData) {
            const caseLink = document.createElement("a");
            caseLink.href = `/caso.html?id=${encodeURIComponent(attempt.caseId)}&attempt=${encodeURIComponent(attempt.id)}`;
            caseLink.style.color = "var(--primary)";
            caseLink.style.textDecoration = "none";
            caseLink.textContent = caseData.title || "Caso sem título";
            title.appendChild(caseLink);
            specialty.textContent = caseData.specialty || "Especialidade não informada";
          } else {
            title.textContent = "Caso excluído";
            specialty.textContent = "Indisponível";
          }

          card.appendChild(heading);
          const caseScenario = caseVersion?.scenario || caseData?.scenario;
          if (caseScenario) {
            const scenario = document.createElement("p");
            scenario.className = "text-sm text-subtle";
            scenario.textContent = `Cenário: ${caseScenario}`;
            card.appendChild(scenario);
          }
          const specialConditions = caseVersion?.specialConditions || caseData?.specialConditions;
          if (specialConditions) {
            const conditions = document.createElement("p");
            conditions.className = "text-sm text-subtle";
            conditions.textContent = `Condições especiais: ${specialConditions}`;
            card.appendChild(conditions);
          }

          const answerBlock = document.createElement("div");
          answerBlock.style.marginTop = "var(--space-3)";
          answerBlock.style.padding = "var(--space-3)";
          answerBlock.style.borderRadius = "var(--radius-md)";
          answerBlock.style.background = "var(--surface-2)";
          appendHistoryField(answerBlock, "Sua resposta", latestHypothesis?.text || "Nenhum diagnóstico registrado.");
          appendHistoryField(answerBlock, "Sua justificativa", latestHypothesis?.justification || "Nenhuma justificativa registrada.");
          appendHistoryField(answerBlock, "Resposta esperada", caseVersion?.diagnosis || caseData?.diagnosis || "Indisponível");
          card.appendChild(answerBlock);

          const actionRow = document.createElement("div");
          actionRow.className = "row";
          actionRow.style.marginTop = "var(--space-3)";
          if (caseData) {
            const resultLink = document.createElement("a");
            resultLink.className = "btn btn-secondary btn-sm";
            resultLink.href = `/caso.html?id=${encodeURIComponent(attempt.caseId)}&attempt=${encodeURIComponent(attempt.id)}`;
            resultLink.textContent = "Ver resultado";
            const redoLink = document.createElement("a");
            redoLink.className = "btn btn-primary btn-sm";
            redoLink.href = `/caso.html?id=${encodeURIComponent(attempt.caseId)}&redo=1`;
            redoLink.textContent = "Refazer caso";
            actionRow.append(resultLink, redoLink);

            const userRating = await getUserRating(currentUser.uid, attempt.caseId);
            if (userRating) {
              const rated = document.createElement("span");
              rated.className = "text-sm text-subtle";
              rated.textContent = `Sua avaliação: ${"★".repeat(Math.max(0, Math.min(5, Number(userRating.stars) || 0)))}`;
              actionRow.appendChild(rated);
            } else {
              const rateLink = document.createElement("a");
              rateLink.className = "btn btn-ghost btn-sm";
              rateLink.href = resultLink.href;
              rateLink.textContent = "Avaliar caso";
              actionRow.appendChild(rateLink);
            }
          }
          if (actionRow.childElementCount) card.appendChild(actionRow);
          attemptsList.appendChild(card);
        }
      } catch (err) {
        console.error(err);
        loadingState.innerHTML = '<p style="color: var(--danger);">Erro ao carregar histórico</p>';
      }
    })();

    function appendHistoryField(container, label, value) {
      const field = document.createElement("p");
      field.style.marginBottom = "var(--space-2)";
      field.style.whiteSpace = "pre-wrap";
      const strong = document.createElement("strong");
      strong.textContent = `${label}: `;
      field.append(strong, document.createTextNode(value));
      container.appendChild(field);
    }

    document.getElementById("logout-btn").addEventListener("click", async () => {
      try {
        await logout();
      } finally {
        location.replace("/login.html");
      }
    });
  </script>
</body>
</html>
