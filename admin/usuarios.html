<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F4C5C">
  <meta name="robots" content="noindex">
  <title>Gestão de Usuários — Admin — LIDMED HUB</title>

  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="/js/ui/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/pages/admin.css">
  <script type="module" src="/js/ui/site-nav.js"></script>
</head>
<body class="admin-shell">
  <header class="admin-header">
    <div class="container">
      <div>
        <a href="/dashboard.html" class="brand" aria-label="LIDMED HUB">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span>LIDMED HUB</span>
        </a>
        <h1 class="admin-title">Gestão de Usuários</h1>
      </div>
      <div class="admin-nav">
        <a href="/admin/usuarios.html" class="btn btn-primary btn-sm">Usuários</a>
        <a href="/dashboard.html" class="btn btn-ghost btn-sm">Voltar ao painel</a>
        <button id="logout-btn" class="btn btn-secondary btn-sm">Sair</button>
      </div>
    </div>
  </header>

  <div class="admin-content container">
    <!-- Filtros -->
    <div class="filters-bar">
      <select id="filter-status" aria-label="Filtrar por status">
        <option value="">Todos os status</option>
        <option value="pending">Pendente</option>
        <option value="approved">Aprovado</option>
        <option value="rejected">Rejeitado</option>
        <option value="suspended">Suspenso</option>
      </select>

      <select id="filter-role" aria-label="Filtrar por perfil">
        <option value="">Todos os perfis</option>
        <option value="student">Estudante</option>
        <option value="professor">Professor</option>
        <option value="admin">Admin</option>
      </select>

      <button id="refresh-btn" class="btn btn-secondary">↻ Atualizar</button>
    </div>

    <!-- Tabela de usuários -->
    <div class="users-table-wrapper">
      <table class="users-table">
        <thead>
          <tr>
            <th>Usuário</th>
            <th>Perfil</th>
            <th>Status</th>
            <th>Cadastro</th>
            <th class="text-right">Ações</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr>
            <td colspan="5" class="table-empty">Carregando usuários...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay" style="display: none;">
    <div class="loading-spinner"></div>
  </div>

  <script type="module">
    import { requireAdmin, clearProfileCache } from "/js/guards.js";
    import { logout } from "/js/auth.js";
    import { listUsers, updateUserStatus, updateUserRole } from "/js/admin.js";
    import { toast } from "/js/ui/toast.js";

    const ROLE_LABEL = {
      student: "Estudante",
      professor: "Professor",
      admin: "Admin"
    };

    const STATUS_LABEL = {
      pending: "Pendente",
      approved: "Aprovado",
      rejected: "Rejeitado",
      suspended: "Suspenso"
    };

    let currentAdmin = null;
    let allUsers = [];

    // Elementos
    const filterStatusEl = document.getElementById("filter-status");
    const filterRoleEl = document.getElementById("filter-role");
    const refreshBtn = document.getElementById("refresh-btn");
    const usersTableBody = document.getElementById("users-tbody");
    const loadingOverlay = document.getElementById("loading-overlay");
    const logoutBtn = document.getElementById("logout-btn");

    // Verifica permissão de admin
    (async () => {
      const ctx = await requireAdmin();
      if (!ctx) return;
      currentAdmin = ctx.user;
      loadUsers();
    })();

    async function loadUsers() {
      try {
        showLoading();
        const filters = {
          status: filterStatusEl.value || undefined,
          role: filterRoleEl.value || undefined
        };

        allUsers = await listUsers(filters);
        renderUsers(allUsers);
        hideLoading();
      } catch (err) {
        console.error(err);
        hideLoading();
        usersTableBody.innerHTML = `
          <tr>
            <td colspan="5" class="table-empty">
              Erro ao carregar usuários. <button class="btn btn-ghost btn-sm" onclick="location.reload()">Tentar novamente</button>
            </td>
          </tr>
        `;
        toast("Erro ao carregar usuários.", { type: "danger" });
      }
    }

    function renderUsers(users) {
      if (users.length === 0) {
        usersTableBody.innerHTML = `
          <tr>
            <td colspan="5" class="table-empty">Nenhum usuário encontrado com os filtros aplicados.</td>
          </tr>
        `;
        return;
      }

      usersTableBody.innerHTML = users.map(user => {
        const createdAt = user.createdAt?.toDate?.() || new Date(user.createdAt);
        const dateStr = createdAt.toLocaleDateString('pt-BR', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        });

        const isCurrentUser = user.uid === currentAdmin.uid;

        return `
          <tr>
            <td>
              <div class="user-cell">
                <div class="user-avatar-sm">
                  ${user.photoURL
                    ? `<img src="${user.photoURL}" alt="">`
                    : `<span>${user.publicName || '?'}</span>`
                  }
                </div>
                <div class="user-info">
                  <span class="user-name">${user.displayName || 'Sem nome'}</span>
                  <span class="user-email">${user.email || '—'}</span>
                </div>
              </div>
            </td>
            <td>
              <span class="badge">${ROLE_LABEL[user.role] || user.role}</span>
            </td>
            <td>
              <span class="badge badge-${user.status}">${STATUS_LABEL[user.status] || user.status}</span>
            </td>
            <td>
              <span class="text-sm text-subtle">${dateStr}</span>
            </td>
            <td>
              <div class="table-actions">
                ${user.status === 'pending' ? `
                  <button
                    class="btn btn-success btn-sm"
                    onclick="window.approveUser('${user.uid}')"
                    ${isCurrentUser ? 'disabled' : ''}
                  >
                    Aprovar
                  </button>
                  <button
                    class="btn btn-danger btn-sm"
                    onclick="window.rejectUser('${user.uid}')"
                    ${isCurrentUser ? 'disabled' : ''}
                  >
                    Rejeitar
                  </button>
                ` : ''}
                ${user.status === 'approved' ? `
                  <button
                    class="btn btn-warning btn-sm"
                    onclick="window.suspendUser('${user.uid}')"
                    ${isCurrentUser ? 'disabled' : ''}
                  >
                    Suspender
                  </button>
                ` : ''}
                ${user.status === 'rejected' || user.status === 'suspended' ? `
                  <button
                    class="btn btn-success btn-sm"
                    onclick="window.approveUser('${user.uid}')"
                    ${isCurrentUser ? 'disabled' : ''}
                  >
                    Aprovar
                  </button>
                ` : ''}
                <a href="/perfil.html?uid=${user.uid}" class="btn btn-ghost btn-sm">Ver perfil</a>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function showLoading() {
      loadingOverlay.style.display = "flex";
    }

    function hideLoading() {
      loadingOverlay.style.display = "none";
    }

    // Ações
    window.approveUser = async (uid) => {
      if (!confirm("Aprovar este usuário?")) return;
      try {
        showLoading();
        await updateUserStatus(currentAdmin.uid, uid, "approved");
        clearProfileCache(uid);
        toast("Usuário aprovado com sucesso!", { type: "success" });
        await loadUsers();
      } catch (err) {
        console.error(err);
        hideLoading();
        toast("Erro ao aprovar usuário.", { type: "danger" });
      }
    };

    window.rejectUser = async (uid) => {
      const reason = prompt("Motivo da rejeição (opcional):");
      if (reason === null) return; // Cancelou

      try {
        showLoading();
        await updateUserStatus(currentAdmin.uid, uid, "rejected", reason);
        clearProfileCache(uid);
        toast("Usuário rejeitado.", { type: "info" });
        await loadUsers();
      } catch (err) {
        console.error(err);
        hideLoading();
        toast("Erro ao rejeitar usuário.", { type: "danger" });
      }
    };

    window.suspendUser = async (uid) => {
      const reason = prompt("Motivo da suspensão:");
      if (!reason) {
        toast("Motivo da suspensão é obrigatório.", { type: "warning" });
        return;
      }

      try {
        showLoading();
        await updateUserStatus(currentAdmin.uid, uid, "suspended", reason);
        clearProfileCache(uid);
        toast("Usuário suspenso.", { type: "warning" });
        await loadUsers();
      } catch (err) {
        console.error(err);
        hideLoading();
        toast("Erro ao suspender usuário.", { type: "danger" });
      }
    };

    // Filtros
    filterStatusEl.addEventListener("change", loadUsers);
    filterRoleEl.addEventListener("change", loadUsers);
    refreshBtn.addEventListener("click", loadUsers);

    // Logout
    logoutBtn.addEventListener("click", async () => {
      try {
        await logout();
      } finally {
        location.replace("/login.html");
      }
    });
  </script>
</body>
</html>
