<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F4C5C">
  <title>Perfil — LIDMED HUB</title>

  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="/js/ui/theme.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/pages/profile.css">
  <script type="module" src="/js/ui/site-nav.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="/dashboard.html" class="brand" aria-label="LIDMED HUB">
        <span class="brand-mark" aria-hidden="true">L</span>
        <span>LIDMED HUB</span>
      </a>
      <div class="row">
        <a href="/meu-perfil.html" class="btn btn-ghost btn-sm" id="my-profile-link">Meu perfil</a>
        <button id="logout-btn" class="btn btn-secondary btn-sm">Sair</button>
      </div>
    </div>
  </header>

  <main class="profile-shell">
    <div class="profile-container">
      <!-- Loading State -->
      <div id="loading-state" style="text-align: center; padding: var(--space-8);">
        <p class="text-muted">Carregando perfil...</p>
      </div>

      <!-- Error State -->
      <div id="error-state" style="display: none;">
        <div class="empty-state">
          <div class="empty-state-icon">⚠️</div>
          <p><strong>Perfil não encontrado</strong></p>
          <p class="text-sm" style="margin-top: var(--space-2);">
            Este usuário não existe ou seu perfil ainda não foi aprovado.
          </p>
          <a href="/dashboard.html" class="btn btn-primary" style="margin-top: var(--space-4);">
            Voltar ao painel
          </a>
        </div>
      </div>

      <!-- Profile Content -->
      <div id="profile-content" style="display: none;">
        <!-- Header -->
        <div class="profile-header">
          <div class="profile-avatar" id="avatar">
            <span id="avatar-text">?</span>
          </div>
          <div class="profile-info">
            <h1 class="profile-name" id="public-name">—</h1>
            <div class="profile-meta">
              <span class="badge" id="role-badge">—</span>
            </div>
          </div>
        </div>

        <!-- Estatísticas Públicas -->
        <section class="profile-section">
          <h3>Estatísticas</h3>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">Casos criados</div>
              <div class="stat-value" id="stat-created">0</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Casos resolvidos</div>
              <div class="stat-value" id="stat-solved">0</div>
            </div>
          </div>
        </section>

        <!-- Casos Públicos (Placeholder para Fase 4) -->
        <section class="profile-section">
          <h3>Casos publicados</h3>
          <div class="empty-state">
            <div class="empty-state-icon">📋</div>
            <p>Casos publicados por este usuário aparecerão aqui na Fase 4.</p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script type="module">
    import { requireApproved, clearProfileCache } from "/js/guards.js";
    import { logout } from "/js/auth.js";
    import { getPublicProfile, getUserPublicCases } from "/js/profile.js";
    import { toast } from "/js/ui/toast.js";

    const ROLE_LABEL = {
      student: "Estudante",
      professor: "Professor / Preceptor",
      admin: "Administrador"
    };

    // Elementos
    const loadingState = document.getElementById("loading-state");
    const errorState = document.getElementById("error-state");
    const profileContent = document.getElementById("profile-content");

    const avatarEl = document.getElementById("avatar");
    const avatarTextEl = document.getElementById("avatar-text");
    const publicNameEl = document.getElementById("public-name");
    const roleBadgeEl = document.getElementById("role-badge");

    const statCreatedEl = document.getElementById("stat-created");
    const statSolvedEl = document.getElementById("stat-solved");

    const logoutBtn = document.getElementById("logout-btn");

    // Pega UID da URL
    const params = new URLSearchParams(location.search);
    const targetUid = params.get("uid");

    if (!targetUid) {
      loadingState.style.display = "none";
      errorState.style.display = "block";
    } else {
      loadProfile();
    }

    async function loadProfile() {
      try {
        // Garante que o usuário está autenticado e aprovado
        const ctx = await requireApproved();
        if (!ctx) return;

        // Busca o perfil público
        const profile = await getPublicProfile(targetUid);

        if (!profile) {
          loadingState.style.display = "none";
          errorState.style.display = "block";
          return;
        }

        renderProfile(profile);

        loadingState.style.display = "none";
        profileContent.style.display = "block";
      } catch (err) {
        console.error(err);
        loadingState.style.display = "none";
        errorState.style.display = "block";
        toast("Erro ao carregar perfil.", { type: "danger" });
      }
    }

    function renderProfile(profile) {
      publicNameEl.textContent = profile.publicName || "Usuário";
      roleBadgeEl.textContent = ROLE_LABEL[profile.role] || profile.role;

      // Avatar
      if (profile.photoURL) {
        avatarEl.innerHTML = `<img src="${profile.photoURL}" alt="Foto de perfil">`;
      } else {
        avatarTextEl.textContent = profile.publicName || "?";
      }

      // Stats
      const stats = profile.statsPublic || {};
      statCreatedEl.textContent = stats.casesCreated || 0;
      statSolvedEl.textContent = stats.casesSolved || 0;
    }

    // Logout
    logoutBtn.addEventListener("click", async () => {
      try {
        await logout();
      } finally {
        location.replace("/login.html");
      }
    });
  </script>
</body>
</html>
