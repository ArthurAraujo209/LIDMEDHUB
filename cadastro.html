<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F4C5C">
  <meta name="description" content="Criar conta no LIDMED HUB.">
  <title>Criar conta — LIDMED HUB</title>

  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <a href="/" class="brand" aria-label="LIDMED HUB, ir para a página inicial">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span>LIDMED HUB</span>
        </a>
      </div>

      <h1 class="auth-title">Criar conta</h1>
      <p class="auth-subtitle">Sua conta passará por aprovação de um administrador antes do primeiro acesso.</p>

      <div id="alert-slot" aria-live="polite"></div>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="name">Nome completo <span class="required" aria-hidden="true">*</span></label>
          <input id="name" name="name" type="text" autocomplete="name" required maxlength="120">
          <span class="field-hint">Você aparecerá publicamente apenas com iniciais (ex.: A.L.).</span>
          <span class="field-error" data-error-for="name"></span>
        </div>

        <div class="field">
          <label id="role-label">Perfil <span class="required" aria-hidden="true">*</span></label>
          <div class="role-options" role="radiogroup" aria-labelledby="role-label">
            <div class="role-option">
              <input type="radio" id="role-student" name="role" value="student" checked>
              <label for="role-student">Estudante</label>
            </div>
            <div class="role-option">
              <input type="radio" id="role-professor" name="role" value="professor">
              <label for="role-professor">Professor / Preceptor</label>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="email">E-mail <span class="required" aria-hidden="true">*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <span class="field-error" data-error-for="email"></span>
        </div>

        <div class="field">
          <label for="password">Senha <span class="required" aria-hidden="true">*</span></label>
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6">
          <span class="field-hint">Mínimo de 6 caracteres.</span>
          <span class="field-error" data-error-for="password"></span>
        </div>

        <div class="field">
          <label for="password2">Confirmar senha <span class="required" aria-hidden="true">*</span></label>
          <input id="password2" name="password2" type="password" autocomplete="new-password" required minlength="6">
          <span class="field-error" data-error-for="password2"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Criar conta</button>
      </form>

      <div class="auth-divider" role="separator" aria-hidden="true">ou</div>

      <button type="button" class="btn btn-secondary btn-block btn-lg" id="google-btn">
        Continuar com Google
      </button>

      <p class="auth-footer">
        Já tem conta? <a href="/login.html"><strong>Entrar</strong></a>
      </p>
    </div>
  </main>

  <script type="module">
    import { signupEmail, loginGoogle, getAuthErrorMessage, ensureUserDoc } from "/js/auth.js";
    import { waitForAuth, loadProfile } from "/js/guards.js";
    import { toast } from "/js/ui/toast.js";

    const form = document.getElementById("signup-form");
    const submitBtn = document.getElementById("submit-btn");
    const googleBtn = document.getElementById("google-btn");

    // Se já autenticado, redireciona.
    (async () => {
      const user = await waitForAuth();
      if (!user) return;
      const profile = await loadProfile(user, { force: true });
      if (profile?.status === "approved") location.replace("/dashboard.html");
      else location.replace("/aguardando-aprovacao.html");
    })();

    function setFieldError(name, message) {
      const el = document.querySelector(`[data-error-for="${name}"]`);
      if (el) el.textContent = message || "";
    }
    function clearErrors() {
      document.querySelectorAll(".field-error").forEach((el) => (el.textContent = ""));
    }

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      clearErrors();

      const fd = new FormData(form);
      const name = String(fd.get("name") || "").trim().replace(/\s+/g, " ");
      const role = String(fd.get("role") || "student");
      const email = String(fd.get("email") || "").trim();
      const password = String(fd.get("password") || "");
      const password2 = String(fd.get("password2") || "");

      let ok = true;
      if (name.length < 2) { setFieldError("name", "Informe seu nome completo."); ok = false; }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setFieldError("email", "Informe um e-mail válido."); ok = false;
      }
      if (!password || password.length < 6) {
        setFieldError("password", "Mínimo de 6 caracteres."); ok = false;
      }
      if (password !== password2) {
        setFieldError("password2", "As senhas não coincidem."); ok = false;
      }
      if (!ok) return;

      submitBtn.disabled = true;
      const original = submitBtn.textContent;
      submitBtn.textContent = "Criando conta…";

      try {
        await signupEmail({ name, email, password, role });
        location.replace("/aguardando-aprovacao.html");
      } catch (err) {
        console.error(err);
        toast(getAuthErrorMessage(err?.code) || err?.message || "Erro ao criar conta.", { type: "danger" });
        submitBtn.disabled = false;
        submitBtn.textContent = original;
      }
    });

    googleBtn.addEventListener("click", async () => {
      googleBtn.disabled = true;
      const original = googleBtn.textContent;
      googleBtn.textContent = "Conectando…";
      try {
        await loginGoogle();
        location.replace("/aguardando-aprovacao.html");
      } catch (err) {
        console.error(err);
        toast(getAuthErrorMessage(err?.code), { type: "danger" });
        googleBtn.disabled = false;
        googleBtn.textContent = original;
      }
    });
  </script>
</body>
</html>
